<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>間違い探し</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1d1d1b;--sub:#6b6a66;--line:#e2e0d8;--acc:#d9480f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--fg:#f1efe8;--sub:#9a988f;--line:#38372f;--acc:#ff8a4c}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--fg:#f1efe8;--sub:#9a988f;--line:#38372f;--acc:#ff8a4c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.hidden{display:none}
.center{text-align:center}
h1{font-size:30px;margin:40px 0 8px}
p{color:var(--sub);margin:0 0 20px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px;width:100%;color:#fff;background:var(--acc);font-size:18px;cursor:pointer}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
svg.pic{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;touch-action:manipulation;background:var(--card)}
.tag{font-size:12px;color:var(--sub);margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
.time{font-size:52px;font-weight:700;color:var(--acc);text-align:center;font-variant-numeric:tabular-nums}
ol{margin:8px 0 0;padding-left:0;list-style:none}
li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
li b{color:var(--acc);min-width:1.5em}
li.no{color:var(--sub)}
</style>
</head>
<body>
<main>
<section id="s1" class="center">
  <h1>間違い探し</h1>
  <p>左右の絵には間違いが<b>5つ</b>あります。<br>全部見つけてください。</p>
  <button id="go">スタート</button>
</section>

<section id="s2" class="hidden">
  <div class="bar"><span>見つけた：<span id="cnt">0</span> / 5</span></div>
  <div class="tag">元の絵</div><div id="pa"></div>
  <div class="tag">間違いのある絵（ここをタップ）</div><div id="pb"></div>
  <button class="sec" id="ans">答えを見る</button>
</section>

<section id="s3" class="hidden">
  <div class="card">
    <div class="center" style="color:var(--sub)" id="tl"></div>
    <div class="time" id="tv"></div>
  </div>
  <div class="tag">元の絵</div><div id="pr0"></div>
  <div class="tag">間違いのある絵</div><div id="pr"></div>
  <div class="card"><strong>答え：5つの間違い</strong><ol id="list"></ol></div>
  <button id="again">最初に戻る</button>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const D=[
 {x:255,y:165,r:16,t:"窓の格子が1本足りない"},
 {x:140,y:90,r:20,t:"雲の形が違う"},
 {x:66,y:240,r:16,t:"柵の杭の高さが違う"},
 {x:212,y:278,r:14,t:"小道の石が1つない"}
];
const D5={x:345,y:160,r:15,t:"リンゴの色が違う"};
function scene(v,extra){
 const B=v==="B";
 let fence="";
 [8,26,44,62,80,98,116].forEach(x=>{{const o=(B&&x===62)?6:0;fence+=`<rect x="${x}" y="${224+o}" width="8" height="${30-o}" fill="#e9d8a6"/>`}});
 return `<svg class="pic" viewBox="0 0 400 300" data-v="${v}">
 <rect width="400" height="300" fill="#cfe8ff"/>
 <ellipse cx="90" cy="232" rx="140" ry="40" fill="#9fd39a"/><ellipse cx="320" cy="235" rx="120" ry="30" fill="#8cc98a"/>
 <rect y="230" width="400" height="70" fill="#7cc576"/>
 <circle cx="60" cy="55" r="26" fill="#ffd43b"/><circle cx="60" cy="55" r="33" fill="none" stroke="#ffe066" stroke-width="3"/>
 <ellipse cx="190" cy="40" rx="38" ry="14" fill="#fff"/><ellipse cx="215" cy="47" rx="28" ry="11" fill="#fff"/>
 <ellipse cx="125" cy="85" rx="26" ry="9" fill="#fff"/>${B?"":'<ellipse cx="140" cy="90" rx="20" ry="8" fill="#fff"/>'}
 <path d="M292 40 q8-9 16 0 q8-9 16 0" stroke="#333" fill="none" stroke-width="2.5"/><path d="M350 66 q6-7 12 0 q6-7 12 0" stroke="#333" fill="none" stroke-width="2"/><path d="M30 120 q6-7 12 0 q6-7 12 0" stroke="#333" fill="none" stroke-width="2"/>
 <circle cx="255" cy="86" r="6" fill="#eee"/><circle cx="263" cy="72" r="8" fill="#eee"/><circle cx="274" cy="58" r="10" fill="#eee"/>
 <rect x="245" y="95" width="20" height="40" fill="#8d6e63"/>
 <rect x="130" y="130" width="150" height="100" fill="#f1e0b0"/>
 <polygon points="120,132 205,75 290,132" fill="#c0392b"/>
 <line x1="150" y1="118" x2="260" y2="118" stroke="#9c2a20" stroke-width="2"/><line x1="170" y1="104" x2="240" y2="104" stroke="#9c2a20" stroke-width="2"/>
 <polygon points="196,230 220,230 235,300 180,300" fill="#e6d8b5"/>
 <ellipse cx="205" cy="255" rx="5" ry="3" fill="#c9b98f"/>${B?"":'<ellipse cx="212" cy="278" rx="6" ry="3" fill="#c9b98f"/>'}
 <rect x="190" y="170" width="36" height="60" fill="#7a4a2a"/>
 <circle cx="218" cy="205" r="3" fill="#ffd43b"/><circle cx="205" cy="98" r="9" fill="#a5d8ff" stroke="#555" stroke-width="2"/><rect x="243" y="90" width="24" height="6" fill="#6d4c41"/><g stroke="#2f7d32" stroke-width="2"><line x1="20" y1="268" x2="20" y2="260"/><line x1="26" y1="268" x2="28" y2="261"/><line x1="320" y1="270" x2="320" y2="262"/><line x1="326" y1="270" x2="329" y2="263"/><line x1="100" y1="280" x2="100" y2="272"/><line x1="106" y1="280" x2="109" y2="273"/></g><circle cx="60" cy="275" r="5" fill="#f783ac"/><circle cx="340" cy="278" r="5" fill="#ffd43b"/>
 <g fill="#a5d8ff" stroke="#555" stroke-width="2"><rect x="145" y="150" width="30" height="30"/><rect x="240" y="150" width="30" height="30"/></g>
 <g stroke="#555" stroke-width="2"><line x1="160" y1="150" x2="160" y2="180"/><line x1="145" y1="165" x2="175" y2="165"/>${B?"":'<line x1="255" y1="150" x2="255" y2="180"/>'}<line x1="240" y1="165" x2="270" y2="165"/></g>
 <rect x="322" y="170" width="16" height="60" fill="#6d4c41"/>
 <circle cx="330" cy="150" r="40" fill="#3f9142"/>
 <circle cx="315" cy="140" r="6" fill="#e03131"/><circle cx="335" cy="130" r="6" fill="#e03131"/><circle cx="318" cy="162" r="6" fill="#e03131"/>
 <circle cx="345" cy="160" r="6" fill="${extra&&B?"#c92a2a":"#e03131"}"/>
 <ellipse cx="300" cy="232" rx="14" ry="10" fill="#2f7d32"/>
 <rect x="4" y="236" width="124" height="5" fill="#d9c58a"/>${fence}
 <circle cx="150" cy="262" r="6" fill="#f06595"/><circle cx="255" cy="262" r="6" fill="#f06595"/><circle cx="285" cy="266" r="6" fill="#ffd43b"/>
 <g class="marks"></g></svg>`;
}
let found=[],t0=null;
function show(id){["s1","s2","s3"].forEach(s=>$(s).classList.toggle("hidden",s!==id))}
function mark(x,y,r,sel){
 document.querySelectorAll(sel).forEach(g=>{
  g.insertAdjacentHTML("beforeend",`<circle cx="${x}" cy="${y}" r="${r+6}" fill="none" stroke="#e03131" stroke-width="4"/>`)})
}
function tap(e){
 if(found.length>=4)return;
 const s=e.currentTarget,b=s.getBoundingClientRect();
 const x=(e.clientX-b.left)/b.width*400,y=(e.clientY-b.top)/b.height*300;
 const i=D.findIndex((d,k)=>!found.includes(k)&&Math.hypot(d.x-x,d.y-y)<d.r);
 if(i>=0){
  found.push(i);mark(D[i].x,D[i].y,D[i].r,"#s2 .marks");
  $("cnt").textContent=found.length;
  if(found.length===4)t0=performance.now();
 }else{
  const g=s.querySelector(".marks");
  g.insertAdjacentHTML("beforeend",`<text class="x" x="${x}" y="${y+8}" font-size="26" fill="#e03131" text-anchor="middle">×</text>`);
  setTimeout(()=>g.querySelectorAll(".x").forEach(n=>n.remove()),500);
 }
}
$("go").onclick=()=>{
 found=[];t0=null;$("cnt").textContent=0;
 $("pa").innerHTML=scene("A");$("pb").innerHTML=scene("B");
 $("pa").firstChild.style.pointerEvents="none";
 $("pb").firstChild.onclick=tap;
 $("pa").firstChild.onclick=null;
 show("s2");
};
$("ans").onclick=()=>{
 const sec=t0===null?null:(performance.now()-t0)/1000;
 $("tl").textContent=sec===null?"4つ目を見つける前に答えを見ました（見つけた数 "+found.length+"）":"4つ目を見つけてから答えを見るまで";
 $("tv").textContent=sec===null?"—":sec.toFixed(1)+" 秒";
 $("pr0").innerHTML=scene("A",true);
 $("pr").innerHTML=scene("B",true);
 const all=[...D,D5];
 all.forEach(d=>mark(d.x,d.y,d.r,"#pr .marks"));
 $("list").innerHTML=all.map((d,i)=>`<li><b>${i+1}</b>${d.t}</li>`).join("");
 show("s3");
};
$("again").onclick=()=>show("s1");
</script>
</body>
</html>
